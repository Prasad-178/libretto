[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libretto-voice"
version = "0.1.0"
description = "Voice workflows, written in YAML"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=15,<17",
]

[project.scripts]
libretto = "libretto.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/libretto"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
